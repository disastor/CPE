# build.yml — CPE component build workflow.
# workflow_call trigger removed - see ngsm-base/build.yml for why.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: build

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: 1.14.3
        description: Version to build and register
  push:
    branches:
      - main

jobs:
  build:
    outputs:
      artifact-id: cpe-artifact-${{ cloudbees.version }}
      version: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: cloudbees-io/checkout@v2

      - name: Build CPE
        uses: docker://bash:5.2
        shell: sh
        run: |
          bash build.sh "${{ inputs.version }}"

      - name: Register build artifact
        uses: cloudbees-io/register-build-artifacts@main
        with:
          artifact-metadata: |
            [
              {
                "name": "cpe",
                "version": "${{ inputs.version }}",
                "url": "https://artifactory.example.internal/hpe-releases/cpe/${{ inputs.version }}/cpe.tar.gz",
                "type": "generic"
              }
            ]
